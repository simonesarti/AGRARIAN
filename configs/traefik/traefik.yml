# Traefik — static configuration (read once at startup).
#
# The L7 half of the ingress tier in CLOUD_ARCHITECTURE.md §7. It terminates TLS
# for the HTTP-family services only: the portal, MediaMTX's HLS and WHEP
# signalling, and ws-server's viewer WebSocket.
#
# WHAT IT MUST NOT TOUCH
# ----------------------
# WebRTC *media* on 8189 (UDP and TCP alike) is end-to-end DTLS-SRTP between the
# browser and MediaMTX and must never be proxied — §8 says so in the table and it
# is not a preference: proxying it would terminate the encryption the media path
# is built on. 8189 stays published straight from the mediamtx service in
# docker-compose.yml. Only WHEP *signalling* comes through here.
#
# RTMPS (1936) and MQTTS (8883) are likewise not here. Traefik can do TCP routers
# with SNI, so it could carry them — but MediaMTX and Mosquitto terminate their own
# TLS deliberately, to preserve the client identity their auth hooks and ACLs depend
# on (§7). Those are the next two pieces of the ingress tier, not this one.
#
# ONE ENTRYPOINT PER UPSTREAM, AND NO Host RULES
# ----------------------------------------------
# The obvious design is a single :443 with Host(`portal.example.com`) routing. That
# is where this ends up, and it is deliberately NOT where it started: there was no
# hostname when this was written, and a Host rule cannot be written against a name
# that does not exist. Dedicated entrypoints route on port alone, which is what let
# the tier be built and tested against a bare address.
#
# A hostname exists as of 2026-08-09 (agrarianlivestock.com), so the collapse onto
# :443 is now possible and is deliberately still not done — it is not free. The
# portal composes its URLs with these port numbers in them (portal/main.py), so
# moving HLS, WHEP and the viewer WebSocket onto 443 means changing that
# composition and the port constants beside it, not just this file. Worth doing
# for the reasons in §9 — fewer ports to open, and the "network that permits only
# 443" item — but as its own change with its own test run.
#
# The port numbers are also the ones §8 already publishes, so the portal's URL
# composition needs no change at all: it flips http->https and ws->wss from
# PUBLIC_TLS and keeps its existing ports.
#
# When a hostname lands, add Host rules to the routers in dynamic/routers.yml and
# collapse the entrypoints onto :443. Nothing else moves.

entryPoints:
  # The portal. §8's 443 row.
  websecure:
    address: ":443"

  # MediaMTX HLS. Kept on its own port rather than merged into 443 because §9's
  # only-443 item is a separate, later decision that wants the hostname first.
  hls:
    address: ":8888"

  # MediaMTX WHEP signalling. The offer/answer exchange only — the media that
  # follows does not come back through here.
  whep:
    address: ":8889"

  # ws-server's viewer WebSocket. §8 puts WSS on 443 alongside the portal; that
  # needs a second hostname to route on, so it waits for the same thing every
  # Host rule waits for.
  wss:
    address: ":8765"

providers:
  file:
    directory: /etc/traefik/dynamic
    # Routers can then change without restarting Traefik.
    #
    # CERTIFICATES CANNOT, and this line used to claim otherwise. What is watched
    # is this DIRECTORY; the leaf lives at /etc/traefik/certs, outside it, so
    # replacing the leaf fires no event and Traefik goes on serving the old one
    # until something in here changes. `touch` on any file below reloads the
    # configuration and re-reads the certificate with it — no restart, no dropped
    # connections — so a renewal hook needs that one extra line.
    #
    # Measured in tests/comms/run_cert_renewal.sh, which also settles the other
    # two: MediaMTX rereads its own certificate unaided, and Mosquitto does so on
    # SIGHUP. Moving the leaf into this directory would fix it the other way, at
    # the cost of handing the file provider files it will try to parse as config.
    watch: true

# No dashboard and no API. It would be one more thing listening, and there is
# nothing here a person needs to click.
api:
  dashboard: false

log:
  level: INFO

# Off, and not by omission. Every viewer token travels in a query string —
# WebSocket handshakes cannot carry headers (§3) — so an access log here would
# accumulate live credentials in a file nobody is thinking about. The same
# reasoning already bounds VIEWER_TOKEN_TTL_S. Turn it on for a specific
# investigation, with a filter, and turn it off again.
accessLog: ~

# ACME is deliberately absent here, and as of 2026-08-09 it is likely to stay that
# way. The certificate this Traefik serves is a real Let's Encrypt wildcard for
# agrarianlivestock.com, obtained OUT OF BAND over DNS-01 against Cloudflare's API
# and copied into certificates/server/ — see CLOUD_ARCHITECTURE.md §7.
#
# Two reasons not to move issuance in here now that it would work:
#   - Under Kubernetes cert-manager owns it and writes the agrarian-tls Secret,
#     which this file's tls.stores block mounts at the same two paths. Configuring
#     a second issuer under compose would mean two mechanisms for one job.
#   - MediaMTX and Mosquitto terminate their own TLS (§7) and need the same leaf on
#     disk. Traefik's ACME store is a private acme.json it does not hand back, so
#     it could only ever serve one of the three terminators.
#
# Only the mount point below was ever load-bearing. If you do enable this, note the
# challenge must be DNS-01 — a wildcard cannot use HTTP-01 — and the provider is
# `cloudflare`, taking CF_DNS_API_TOKEN from the environment.
#
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: <ops address>
#       storage: /etc/traefik/acme/acme.json
#       dnsChallenge:
#         provider: cloudflare      # DNS-01, because a wildcard needs it
