# Traefik — the L7 half of the ingress tier.
#
# It terminates HTTPS and WSS for the four things a browser touches: the portal,
# MediaMTX's HLS and WHEP signalling, and ws-server's viewer WebSocket. Those four
# have ClusterIP Services and no LoadBalancer of their own, because a direct
# publish would be a plaintext path around the terminator (§8).
#
# 8189 IS NOT HERE AND MUST NEVER BE. WebRTC media is end-to-end DTLS-SRTP between
# the browser and MediaMTX; proxying it would terminate the encryption the media
# path is built on. It arrives on mediamtx-public instead.
#
# NOT AN INGRESS, AND NOT THE GATEWAY API. Kubernetes does not reverse-proxy
# anything itself — those are interfaces, and a controller has to implement them.
# Traefik is that controller here, run as an ordinary Deployment reading the same
# file provider the compose stack reads, which is what makes the routing config
# survive the migration rather than being rewritten into a vendor's annotation
# dialect (§2). Nothing in the design depends on Traefik specifically.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: agrarian
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: agrarian
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/part-of: agrarian
    spec:
      containers:
        - name: traefik
          image: traefik:v3.3
          ports:
            - name: websecure
              containerPort: 443
            - name: hls
              containerPort: 8888
            - name: whep
              containerPort: 8889
            - name: wss
              containerPort: 8765
          volumeMounts:
            - name: static
              mountPath: /etc/traefik/traefik.yml
              subPath: traefik.yml
              readOnly: true
            - name: dynamic
              mountPath: /etc/traefik/dynamic
              readOnly: true
            - name: certs
              mountPath: /etc/traefik/certs
              readOnly: true
          # No /health endpoint is configured (api.dashboard is off and there is
          # no ping entrypoint), so readiness is a TCP connect on the port that
          # actually matters.
          readinessProbe:
            tcpSocket:
              port: websecure
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: static
          configMap:
            name: agrarian-traefik-static
        - name: dynamic
          configMap:
            name: agrarian-traefik-dynamic
        - name: certs
          secret:
            # THE ONE RENEWAL CAVEAT THAT GOES AWAY HERE. Under compose, Traefik
            # does not notice a replaced leaf: `watch: true` watches the dynamic
            # directory and the certificate is mounted outside it, so a renewal
            # fires no event and Traefik serves the expired one indefinitely
            # (measured, run_cert_renewal.sh). The documented workaround is to
            # touch a file in the watched directory from the renewal hook.
            #
            # A Secret mounted as a volume is different: the kubelet refreshes the
            # projected files in place when cert-manager rewrites the Secret, and
            # Traefik's file watcher sees the certificate change. The deployment
            # hook §9 asks for is therefore not needed on this platform — which is
            # one of the few places the migration removes work rather than moving
            # it.
            secretName: agrarian-tls
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: agrarian
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: agrarian
spec:
  type: LoadBalancer
  # The rate limiter counts per source address, so the real client address has to
  # survive the hop. With Cluster (the default) the kube-proxy SNATs and every
  # client arrives as a node address — which is the "one attacker locks out
  # everybody" failure §8 describes for TRUSTED_PROXY_HOPS set too low, arriving
  # by a different route.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
    - name: hls
      port: 8888
      targetPort: hls
      protocol: TCP
    - name: whep
      port: 8889
      targetPort: whep
      protocol: TCP
    - name: wss
      port: 8765
      targetPort: wss
      protocol: TCP
