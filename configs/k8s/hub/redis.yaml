# Redis — the alert fan-out bus, and the portal's rate-limit counters.
#
# Two logical databases on one instance, as in compose: db 0 carries ws-server's
# pub/sub fan-out, db 1 the portal's INCR counters. Nothing would collide if they
# shared, but a FLUSHDB aimed at one should not reach the other.
#
# NO PERSISTENCE, AND NO PersistentVolumeClaim. Both uses are explicitly
# non-authoritative (§2): losing the whole instance drops in-flight fan-out and
# resets some counters, and both callers are built for exactly that — ws-server
# resubscribes on reconnect, and the portal's limiter fails open. Giving this a
# volume would buy nothing and would turn a restart into a storage operation.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: agrarian
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: agrarian
spec:
  # One. Replicating this would mean two independent fan-out buses and two
  # independent counter stores, which is the defect the counters exist to avoid
  # (§4: "N replicas each holding their own counter is a limit of N × whatever is
  # written down"). Redis clustering is a different design, not a replica count.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: agrarian
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports:
            - name: redis
              containerPort: 6379
          # compose's healthcheck, which has no direct analogue: a readiness probe
          # gates traffic and a liveness probe restarts. Both are wanted here.
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: agrarian
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: agrarian
spec:
  # ClusterIP. §8 lists Redis among the services that must never be routed from
  # outside, and in a cluster that is the default rather than something to arrange.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
