# ── Image requirement ─────────────────────────────────────────────────────────
# This config REQUIRES the `-ffmpeg` image tag (see docker-compose.yml).
#
# The default `bluenviron/mediamtx` image contains exactly three files — the
# binary, this config and a licence — with no shell and no wget. MediaMTX execs
# runOn* commands directly rather than through a shell, so on that image every
# hook below dies with:
#
#   runOnAvailable command exited: exec: "wget": executable file not found in $PATH
#
# which MediaMTX logs at INF and otherwise ignores. The `-ffmpeg` tag is Alpine
# based and provides busybox wget, which sends the form-encoded body these
# endpoints expect. The tag is chosen for the shell, not for ffmpeg.

# ── The drone-facing listeners, and their TLS ─────────────────────────────────
# MediaMTX terminates its own TLS rather than sitting behind Traefik, and that is
# a decision rather than a limitation (§7): Traefik can route TCP with SNI, but
# terminating here preserves the client identity the auth hook below depends on,
# and RTMP and RTSP are arbitrary TCP that an L7 proxy has nothing useful to say
# about anyway.
#
# The certificate is the same leaf Traefik and Mosquitto read — one file for all
# three terminators, written by scripts/generate_local_certs.sh today and by
# cert-manager into a Secret later. None of the three knows or cares who signed
# it, which is why this could be built before a hostname exists.
#
# encryption: optional, NOT strict. §7 keeps the plaintext listeners as a narrow
# fallback for drones whose firmware cannot do TLS at all, and a controller that
# cannot be pointed at rtmps:// is otherwise a controller that cannot fly. Every
# drone that CAN should be given the rtmps:// URL the portal prints, because the
# stream key is both the credential and the path — in the clear it is readable by
# anyone on the wire, and it does not expire.
#
# Switch both to "strict" the day no drone needs the fallback. Nothing else has
# to change: the plaintext listeners simply stop existing.

rtsp: yes
rtspAddress: :8554
rtspsAddress: :8322
rtspEncryption: optional
rtspServerCert: /certs/server.crt
rtspServerKey: /certs/server.key
# The handshake is TCP either way; this is the media transport. Encryption adds
# UDP listeners for SRTP/SRTCP (:8004 and :8005) beside the RTP/RTCP pair (:8000,
# :8001) that "udp" already opened — neither pair is published in compose, and
# the app pulls its raw feed over TCP (rtsp_transport;tcp in stream_video_reader).
# They are listed here so that stays a decision rather than a discovery, which is
# the same objection the srt/moq lines below record.
rtspTransports: [tcp, udp]

rtmp: yes
rtmpAddress: :1935
rtmpsAddress: :1936
rtmpEncryption: optional
rtmpServerCert: /certs/server.crt
rtmpServerKey: /certs/server.key

webrtc: yes
webrtcAddress: :8889
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

# ICE over TCP, in addition to the UDP flow on the same port number. Off by
# default in MediaMTX (webrtcLocalTCPAddress: "").
#
# WebRTC media is UDP, and some networks — office and corporate firewalls
# especially — pass no UDP at all. Without this such a viewer sees nothing and
# has no way round it. With it the same WHEP session, the same viewer token and
# the same player fall back to TCP, at a modest cost in behaviour under packet
# loss since TCP retransmits what a real-time stream would rather drop.
#
# This is the reason the portal no longer offers HLS as the fallback: HLS meant
# a second protocol, a second player and a second manifest-auth path to solve a
# problem one line of transport configuration solves, and it costs 6-30s of
# latency, which puts the video visibly out of step with the alert feed beside
# it. What ICE-TCP does NOT cover is a network that permits only 443 — see §9.
webrtcLocalTCPAddress: :8189

hls: yes
hlsAddress: :8888

# Off explicitly, not left to default. MediaMTX v1.19 enables SRT (:8890) and MoQ
# (:8892) out of the box. Neither is published in compose, so nothing was reachable
# and the auth hook would have covered them like any other protocol — but a listener
# nobody decided to run is a listener nobody is watching, and a future compose change
# that publishes a port range would expose them silently. Turn them on deliberately
# if a drone ever needs SRT.
srt: no
moq: no

readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 1024

# ── Authentication ────────────────────────────────────────────────────────────
# Every publish and every read is POSTed to db-writer, which answers 2xx to allow
# and 401 to deny.
#
# The alternative, authInternalUsers, is a static list in this file: it cannot
# express "user 101 signed up while 100 people were streaming" without a config
# change and a reload. Asking a question instead of holding a roster means a new
# user works the instant their database row exists.
#
# Choosing this over MediaMTX's built-in JWT method (authJWTJWKS) keeps the
# credential form open. A drone controller cannot fetch a token — the operator
# types a short key by hand — while a browser can present a JWT. One endpoint in
# Python can accept both; authJWTJWKS could only accept the second.
authMethod: http
authHTTPAddress: http://db-writer:8000/auth/mediamtx

# The default exclusions. api/metrics/pprof are not exposed outside the cluster
# network, so gating them here would put db-writer on the path of every scrape for
# no isolation benefit.
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

# ── Paths ─────────────────────────────────────────────────────────────────────
# Regex paths, not a fixed list — one entry serves every tenant. There is no
# catch-all: a path matching neither pattern is rejected by MediaMTX before
# authentication is even consulted.
paths:

  # Ingest. $G1 is the stream key, which doubles as the path — the operator types
  # rtmps://ingest.<host>:1936/in/<key> into the controller and has nowhere to put
  # a second credential.
  #
  # Safe only because no viewer ever touches this path: viewers read out/<uuid>,
  # which is unrelated to the key. Unify the two and every viewer learns a live
  # ingest credential.
  #
  # Alphabet is Crockford base32 and must stay in step with STREAM_KEY_ALPHABET in
  # db_writer/constants.py — note the absent i, l, o and u.
  "~^in/([0-9abcdefghjkmnpqrstvwxyz]{16})$":
    source: publisher

    # Spawn and tear down the GPU container for this flight. These belong on
    # availability rather than on the auth hook: the auth hook also fires for
    # aborted and retried connections that never carry a single frame, and
    # spawning from it would start GPU containers for drones that never stream.
    #
    # $G1 is the stream key. wget comes from the image — see the note below.
    runOnAvailable: wget -q -O /dev/null --post-data="key=$G1" http://orchestrator:8000/stream-online
    runOnUnavailable: wget -q -O /dev/null --post-data="key=$G1" http://orchestrator:8000/stream-offline

  # Annotated output. $G1 is the flight's public_uuid — random rather than derived
  # from flight_id, because the sequential primary key would make every tenant's
  # video path enumerable.
  "~^out/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$":
    source: publisher
    record: yes
    recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
    recordFormat: fmp4
    # A ceiling, not a schedule. What actually ends a segment is the publisher
    # disconnecting: MediaMTX always closes and flushes the current file then,
    # regardless of this setting. Since every flight ends with a disconnect, and
    # every flight boundary IS a disconnect, no recording can ever span two
    # flights — which is the property the recordings table depends on.
    #
    # 24h rather than the 1h this used to hold. No consumer airframe flies long
    # enough for an hourly split to fire, so it never once divided a real flight;
    # it only stood between the archive and one file per flight. This value is
    # now what it says it is: the ceiling for a session that never disconnects.
    #
    # RAISED, NOT DELETED. An omitted line inherits whatever the next MediaMTX
    # release defaults to, and this file already records that mistake once — SRT
    # and MoQ ran on every start in v1.19 because they were enabled by default and
    # nobody had decided so. Quoted in the recordings PVC comment in
    # configs/k8s/hub/mediamtx.yaml, which moves with it.
    recordSegmentDuration: 24h
    # Notify the recorder sidecar when a segment is complete so it can upload it.
    # $MTX_SEGMENT_PATH is set by MediaMTX at hook runtime.
    runOnRecordSegmentComplete: wget -q -O /dev/null --post-data="path=$MTX_SEGMENT_PATH" http://recorder:8000/on-segment-complete

  # The previous 'drone' and 'annot' paths are gone. They were fixed names shared by
  # every tenant and readable by anyone who knew them, which is the read-authorisation
  # gap this change closes. The app tier still publishes to them and is rewired in the
  # orchestrator step; until then the local end-to-end run will not connect.
