persistence true
persistence_location /mosquitto/data/

log_type subscribe
log_type unsubscribe
log_type error
log_type warning
log_type notice
log_type information

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log

listener 1883 0.0.0.0

# ── Authorisation: mosquitto-go-auth, HTTP backend ───────────────────────────
# Mirrors MediaMTX's HTTP auth hook: Mosquitto asks db-writer on every CONNECT
# and every PUBLISH/SUBSCRIBE instead of holding a roster, so the streams table
# stays the single source of truth and revocation needs no reload. Requires the
# iegomez/mosquitto-go-auth image (see docker-compose.yml) — the plugin does not
# ship in the stock eclipse-mosquitto image. See db_writer/mqtt_auth.py.
allow_anonymous false
auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host db-writer
auth_opt_http_port 8000
auth_opt_http_getuser_uri /auth/mqtt/user
auth_opt_http_aclcheck_uri /auth/mqtt/acl
# Plain 2xx/401, no body — the same contract /auth/mediamtx already uses.
auth_opt_http_response_mode status
auth_opt_http_params_mode json

# ── MQTTS — MQTT over TLS (port 8883) ────────────────────────────────────────
# The telemetry half of the drone-facing ingress tier (§7). Mosquitto terminates
# its own TLS for the same reason MediaMTX does: the client identity the ACL
# check below depends on has to survive the hop, and MQTT is arbitrary TCP an L7
# proxy has nothing to say about.
#
# The certificate is the same leaf MediaMTX and Traefik read — one file, three
# terminators. scripts/generate_local_certs.sh writes it (and drops ca.crt beside
# it, which is why all three paths point at one mounted directory); cert-manager
# writes the same two names into a Secret when this moves to Kubernetes.
#
# What crosses this listener is the reason it matters: the drone's MQTT password
# IS its stream key (db_writer/mqtt_auth.py), the same key that is also the video
# ingest path. Plain MQTT on 1883 puts a credential that never expires on the
# wire in the clear, twice over.
listener 8883 0.0.0.0
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Clients must present a valid cert signed by the CA (mutual TLS).
# Set to false to allow clients without a certificate (server-only TLS).
#
# false, and it is not a shortcut. Mutual TLS would be a SECOND credential the
# operator has to get onto the drone, and §3's whole argument for the stream key
# is that the operator types one short string into a controller and has nowhere
# to put anything else. A client certificate per drone is a certificate lifecycle
# per drone; the key already carries the identity and is revocable instantly.
require_certificate false

# tls_version is deliberately NOT set, and that was measured rather than assumed.
# Left unset this listener accepts TLS 1.2 and 1.3 and refuses 1.0 and 1.1 — the
# same floor Traefik enforces on the browser side, so there is nothing to raise.
# Setting it does not help either: in this build the option caps the version
# instead of flooring it, so `tls_version tlsv1.2` would refuse the 1.3 clients
# this should prefer while still admitting nothing new below.
#
# tests/comms/run_ingress_tls.sh asserts the floor with a client that can actually
# speak TLS 1.1 (OpenSSL 1.1.1 — modern curl and OpenSSL 3 refuse to send it at
# all, so a check written with those passes against a server that allows it and
# proves nothing). A floor that is never exercised looks exactly like one that is.

# 1883 stays, as the same narrow fallback the plaintext RTMP listener is: a drone
# whose firmware cannot do TLS at all is otherwise a drone that cannot fly. Every
# drone that can should be pointed at 8883. Remove the 1883 listener above the day
# none needs it — nothing else here changes.
#
# allow_anonymous false and the go-auth plugin above already apply to this
# listener too — nothing further to add here for authorisation, only transport.
