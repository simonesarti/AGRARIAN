# AGRARIAN — communication services stack
#
# Deploy this on the partner VM (or locally alongside the app container).
# All services restart automatically unless explicitly stopped.
#
# Ports exposed to the app machine:
#   8554  — MediaMTX RTSP  (app pulls raw drone stream)
#   1935  — MediaMTX RTMP  (app pushes annotated stream)
#   1883  — Mosquitto MQTT (app subscribes to telemetry)
#   8001  — ws-server HTTP API (app POSTs alerts)
#   8002  — db-writer HTTP API (app POSTs alerts)
#
# Ports exposed to the viewer — all TLS, all through Traefik except the last:
#   443   — portal (HTTPS)
#   8888  — MediaMTX HLS (HTTPS)
#   8889  — MediaMTX WebRTC WHEP signalling (HTTPS)
#   ${WS_PORT} — WebSocket alert stream (WSS)
#   8189  — MediaMTX WebRTC (ICE/media, UDP and TCP) — NOT proxied, end-to-end
#           DTLS-SRTP between the browser and MediaMTX
#
# THE BROWSER-FACING HALF IS NOW ENCRYPTED; THE DRONE-FACING HALF IS NOT.
# Traefik terminates HTTPS and WSS for the portal, HLS, WHEP and the viewer
# WebSocket (§7). What is still in the clear is everything a drone touches:
# RTMP 1935 and RTSP 8554 have no `encryption` block in mediamtx.yaml, and
# Mosquitto's MQTTS listener is still commented out — so stream keys and
# telemetry credentials continue to cross the wire in plain text. Those are the
# next two pieces of the ingress tier. Keep drones on a trusted network.
#
# Certificates come from scripts/generate_local_certs.sh, which stands in for
# cert-manager until a hostname exists — Let's Encrypt will not issue for an IP,
# and MEDIAMTX_HOST is one. Run it once before `docker compose up`.
#
# Recording: MediaMTX records the annotated stream to the 'recordings' volume.
#            The recorder sidecar uploads each segment on completion.
#            Set RECORDING_STORE_SERVICE in .env to local | azure | aws.

name: agrarian-comms

networks:
  comms-net:
    driver: bridge
    name: comms-net

volumes:
  mosquitto-data:
  mosquitto-log:
  recordings:

services:

  # ── Ingress: TLS termination for the HTTP family ──────────────────────────────
  # The L7 half of §7's ingress tier. It terminates HTTPS and WSS for the portal,
  # MediaMTX's HLS and WHEP signalling, and ws-server's viewer WebSocket — and
  # nothing else.
  #
  # It publishes the ports those four services used to publish themselves. They no
  # longer do: reaching them directly would be a plaintext path around the
  # terminator, which is the thing this service exists to remove.
  #
  # 8189 is NOT here and must never be. WebRTC media is end-to-end DTLS-SRTP
  # between the browser and MediaMTX; proxying it would terminate the encryption
  # the media path is built on. It stays published by the mediamtx service below.
  #
  # No Docker socket. Traefik's usual compose deployment discovers routes from
  # container labels, which means mounting /var/run/docker.sock into the one
  # process facing the internet. Routes come from configs/traefik/dynamic/ instead
  # — the same file provider Kubernetes will use, and one fewer holder of the
  # socket the orchestrator is already criticised for holding (§9).
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      portal:
        condition: service_healthy
      ws-server:
        condition: service_healthy
    ports:
      - "443:443"                  # portal
      - "8888:8888"                # MediaMTX HLS
      - "8889:8889"                # MediaMTX WHEP signalling
      # WS_PORT now names the port a VIEWER dials, which is this one. Inside the
      # network the hop is fixed at 8765 on both sides, because traefik.yml is
      # static YAML with no variable interpolation — a configurable inner port
      # would be one that silently disagrees with the entrypoint.
      - "${WS_PORT:-8765}:8765"    # ws-server viewer WebSocket
    volumes:
      - ./configs/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./configs/traefik/dynamic:/etc/traefik/dynamic:ro
      # Written by scripts/generate_local_certs.sh today, mounted from a
      # cert-manager Secret later. Traefik watches the dynamic directory, so a
      # renewed leaf is picked up without a restart — the property MediaMTX has
      # not yet been shown to share (§9).
      - ./certificates/server:/etc/traefik/certs:ro

  # ── Alert fan-out bus ─────────────────────────────────────────────────────────
  # Carries alerts between ws-server replicas so a viewer connected to one replica
  # still receives alerts published to another. Not exposed to the host.
  #
  # Holds no state: pub/sub only, nothing cached, nothing replayed. Persistence is
  # therefore disabled outright — a restart loses nothing and subscribers reconnect.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [comms-net]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Video server ──────────────────────────────────────────────────────────────
  mediamtx:
    # The `-ffmpeg` tag is required, and NOT for ffmpeg. The default image ships the
    # binary and nothing else — no shell, no wget — and MediaMTX execs runOn* hooks
    # directly, so on that image every hook in mediamtx.yaml fails with
    # `exec: "wget": executable file not found in $PATH`. That is logged at INF and
    # otherwise silent: the recorder is never told a segment finished, and the
    # orchestrator is never told a stream went live. This tag is Alpine based and
    # provides busybox wget.
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      recorder:
        condition: service_healthy
      db-writer:
        condition: service_healthy
      orchestrator:
        condition: service_started
    ports:
      # Still in the clear, and still published directly: these are the drone's
      # ports, and MediaMTX terminates their TLS itself rather than through
      # Traefik (§7 — it preserves the client identity the auth hook depends on).
      # RTMPS 1936 and RTSPS 8322 land when mediamtx.yaml gets an `encryption`
      # block; until then this is the plaintext path the ingress tier has not
      # closed yet.
      - "8554:8554"       # RTSP  — drone publishes + app pulls raw stream
      - "1935:1935"       # RTMP  — app pushes annotated stream
      # HLS (8888) and WHEP signalling (8889) are NOT published here any more.
      # Traefik terminates TLS for both and reaches them over comms-net; a direct
      # publish would be a plaintext route around the terminator.
      #
      # 8189 is published here and must stay that way. WebRTC media is end-to-end
      # DTLS-SRTP between the browser and MediaMTX, so it is the one viewer-facing
      # port Traefik must never carry.
      - "8189:8189/udp"   # WebRTC ICE — actual media flow
      - "8189:8189/tcp"   # WebRTC ICE over TCP — for networks that pass no UDP
    environment:
      MTX_WEBRTCICEHOSTNAT1TO1IPS: ${MEDIAMTX_HOST}
    volumes:
      - ./configs/mediamtx/mediamtx.yaml:/mediamtx.yml:ro
      - recordings:/recordings

  # ── MQTT broker ───────────────────────────────────────────────────────────────
  mosquitto:
    # eclipse-mosquitto does not ship the go-auth plugin mosquitto.conf now
    # requires (auth_plugin /mosquitto/go-auth.so). This image is the stock
    # broker plus that plugin prebuilt in; its config lives at
    # /etc/mosquitto/mosquitto.conf, not /mosquitto/config/ like the stock image.
    image: iegomez/mosquitto-go-auth:2.1.0-mosquitto_2.0.15
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
    ports:
      - "1883:1883"     # MQTT  — drone publishes, app subscribes
      #- "8883:8883"    # MQTTS — uncomment together with the listener block in mosquitto.conf
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      #- ./certificates/mosquitto:/mosquitto/certs:ro   # required for MQTTS

  # ── DB writer sidecar ─────────────────────────────────────────────────────────
  db-writer:
    build:
      context: db_writer
    restart: unless-stopped
    networks: [comms-net]
    ports:
      - "8002:8000"     # HTTP API — app POSTs alerts here from outside the comms network
    environment:
      DB_SERVICE:         ${DB_SERVICE:-postgresql}
      DB_HOST:            ${DB_HOST}
      DB_PORT:            ${DB_PORT:-5432}
      DB_NAME:            ${DB_NAME}
      DB_WORKER_NAME:     ${DB_WORKER_NAME}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD}
      # Mints both viewer and publisher tokens; ws-server validates with the same secret.
      SESSION_JWT_SECRET:    ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env}
      VIEWER_TOKEN_TTL_S:    ${VIEWER_TOKEN_TTL_S:-43200}
      PUBLISHER_TOKEN_TTL_S: ${PUBLISHER_TOKEN_TTL_S:-86400}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Portal ────────────────────────────────────────────────────────────────────
  # The account pages, and the only new service on the public side. It is what keeps
  # db-writer off it: the browser talks to the portal, the portal talks to db-writer
  # over comms-net.
  #
  # Note what is NOT here: SESSION_JWT_SECRET and every DB_* variable. The portal
  # mints nothing, validates nothing and reads no table — it forwards the session
  # cookie and lets db-writer answer. That is deliberate (§7), so adding either of
  # those here would undo it.
  portal:
    build:
      context: portal
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host publish. Traefik terminates 443 and forwards here over comms-net,
    # which is what makes the Secure session cookie work at all: a Secure cookie
    # is not returned over http://, so the plain-HTTP port this used to publish
    # was a login that appeared to succeed and then forgot you.
    environment:
      DB_WRITER_URL: http://db-writer:8000
      # Backs the rate limits on /login and /register — the two endpoints anyone
      # on the internet can reach. Database 1, not ws-server's 0: nothing would
      # collide (INCR keys against pub/sub channels), but a FLUSHDB aimed at one
      # should not reach the other.
      REDIS_URL: redis://redis:6379/1
      # How many proxies sit in front. It decides which X-Forwarded-For entry is
      # believed, so it must match reality: too high and a client picks its own
      # rate-limit bucket, or pushes somebody else's to the limit.
      #
      # 1, not 0, since Traefik landed. Traefik appends the client address to
      # X-Forwarded-For and is now the only way in, so the peer address this
      # process sees is always Traefik's — and at 0 the limiter would count every
      # client on the internet into a single bucket, where one attacker locks out
      # everybody. Add one for each further HTTP proxy; an L4 load balancer that
      # preserves the source address adds none.
      TRUSTED_PROXY_HOPS: ${PORTAL_TRUSTED_PROXY_HOPS:-1}
      # Hostnames the BROWSER dials, not ones this container dials. Video and
      # alerts go straight from the browser to MediaMTX and ws-server; the portal
      # only composes the URLs.
      # Required, but guarded in the portal rather than with ${VAR:?} here: a
      # compose interpolation error aborts the whole file, so the guard that
      # belongs to one service would stop every service from starting.
      MEDIA_PUBLIC_HOST: ${MEDIAMTX_HOST}
      WS_PUBLIC_HOST:    ${WS_PUBLIC_HOST:-}
      WS_PORT:           ${WS_PORT:-8765}
      # Both must stay true wherever the browser reaches this over HTTPS. A Secure
      # cookie is simply not sent over http://, so turning it off for a local test
      # and forgetting looks like a login that works and then forgets you.
      COOKIE_SECURE:     ${PORTAL_COOKIE_SECURE:-true}
      PUBLIC_TLS:        ${PORTAL_PUBLIC_TLS:-true}
      PORTAL_ALLOWED_ORIGIN_HOSTS: ${PORTAL_ALLOWED_ORIGIN_HOSTS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── WS server ─────────────────────────────────────────────────────────────────
  ws-server:
    build:
      context: ws_server
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # The viewer WebSocket is no longer published here — Traefik terminates WSS
      # on the host and reaches this listener over comms-net.
      - "8001:8000"     # HTTP API — app POSTs alerts here from outside the comms network
    environment:
      # Fixed, not ${WS_PORT}. This is the inner hop Traefik dials, and it has to
      # match the entrypoint in the static traefik.yml, which cannot interpolate.
      # WS_PORT stays the knob for the port a viewer dials; see the traefik
      # service above.
      WS_PORT: 8765
      REDIS_URL: redis://redis:6379/0
      # Shared with db-writer, which mints the tokens this validates. No publisher
      # secret here: app containers present a per-flight token db-writer issued them.
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Flight orchestrator ───────────────────────────────────────────────────────
  # One GPU container per active flight, created when a stream goes live and destroyed
  # when it stops. MediaMTX drives it through runOnAvailable / runOnUnavailable.
  #
  # NOT exposed to the host, and it must never be: it holds the Docker socket, so
  # anything that can reach it can start containers on this machine.
  orchestrator:
    build:
      context: orchestrator
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
    volumes:
      # The Docker backend's whole privilege. Swapped for a service account when the
      # Kubernetes backend lands.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_IMAGE:         ${APP_IMAGE:?set APP_IMAGE in .env — the GPU app image to run per flight}
      DB_WRITER_URL:     http://db-writer:8000
      APP_NETWORK:       comms-net
      APP_GPUS:          ${APP_GPUS:-all}
      APP_SHM_SIZE:      ${APP_SHM_SIZE:-256m}
      RECONNECT_GRACE_S: ${RECONNECT_GRACE_S:-30}

      # Everything below is forwarded to each flight container with the APP_ENV_
      # prefix stripped. The orchestrator does not interpret any of it; per-flight
      # values (flight id, token, stream paths) always win over these.
      APP_ENV_DB_WRITER_URL:              http://db-writer:8000
      APP_ENV_WS_SERVER_URL:              http://ws-server:8000
      APP_ENV_VIDEO_STREAM_READER_HOST:   mediamtx
      APP_ENV_VIDEO_OUT_STREAM_HOST:      mediamtx
      APP_ENV_TELEMETRY_LISTENER_HOST:    mosquitto
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Recording upload sidecar ──────────────────────────────────────────────────
  recorder:
    build:
      context: recorder
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
    environment:
      DB_WRITER_URL:                     http://db-writer:8000
      RECORDING_STORE_SERVICE:           ${RECORDING_STORE_SERVICE:-local}
      RECORDING_DELETE_LOCAL_ON_SUCCESS: ${RECORDING_DELETE_LOCAL_ON_SUCCESS:-false}
      RECORDING_AZURE_CONNECTION_STRING: ${RECORDING_AZURE_CONNECTION_STRING:-}
      RECORDING_AZURE_CONTAINER_NAME:    ${RECORDING_AZURE_CONTAINER_NAME:-}
      RECORDING_AZURE_BLOB_PREFIX:       ${RECORDING_AZURE_BLOB_PREFIX:-}
      RECORDING_AWS_BUCKET_NAME:         ${RECORDING_AWS_BUCKET_NAME:-}
      RECORDING_AWS_KEY_PREFIX:          ${RECORDING_AWS_KEY_PREFIX:-}
      RECORDING_AWS_ACCESS_KEY_ID:       ${RECORDING_AWS_ACCESS_KEY_ID:-}
      RECORDING_AWS_SECRET_ACCESS_KEY:   ${RECORDING_AWS_SECRET_ACCESS_KEY:-}
      RECORDING_AWS_REGION_NAME:         ${RECORDING_AWS_REGION_NAME:-}
    volumes:
      - recordings:/recordings
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
