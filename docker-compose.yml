# AGRARIAN — communication services stack
#
# Deploy this on the partner VM (or locally alongside the app container).
# All services restart automatically unless explicitly stopped.
#
# Ports exposed to the app machine:
#   8554  — MediaMTX RTSP  (app pulls raw drone stream)
#   1935  — MediaMTX RTMP  (app pushes annotated stream)
#   1883  — Mosquitto MQTT (app subscribes to telemetry)
#   8001  — ws-server HTTP API (app POSTs alerts)
#   8002  — db-writer HTTP API (app POSTs alerts)
#
# Ports exposed to the viewer:
#   8888  — MediaMTX HLS
#   8889  — MediaMTX WebRTC (WHEP signalling)
#   8189  — MediaMTX WebRTC (ICE/media UDP)
#   ${WS_PORT} — WebSocket alert stream
#   8003  — portal
#
# NOTHING HERE IS ENCRYPTED. There is no reverse proxy in this file and no TLS
# listener on MediaMTX or Mosquitto, so stream keys, telemetry credentials and the
# session cookie all cross the wire in the clear. The target — a cloud L4 load
# balancer, Traefik terminating HTTPS/WSS, cert-manager issuing for all three
# terminators — is §7 of CLOUD_ARCHITECTURE.md and is not built. Run this on a
# trusted network.
#
# Recording: MediaMTX records the annotated stream to the 'recordings' volume.
#            The recorder sidecar uploads each segment on completion.
#            Set RECORDING_STORE_SERVICE in .env to local | azure | aws.

name: agrarian-comms

networks:
  comms-net:
    driver: bridge
    name: comms-net

volumes:
  mosquitto-data:
  mosquitto-log:
  recordings:

services:

  # ── Alert fan-out bus ─────────────────────────────────────────────────────────
  # Carries alerts between ws-server replicas so a viewer connected to one replica
  # still receives alerts published to another. Not exposed to the host.
  #
  # Holds no state: pub/sub only, nothing cached, nothing replayed. Persistence is
  # therefore disabled outright — a restart loses nothing and subscribers reconnect.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [comms-net]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── Video server ──────────────────────────────────────────────────────────────
  mediamtx:
    # The `-ffmpeg` tag is required, and NOT for ffmpeg. The default image ships the
    # binary and nothing else — no shell, no wget — and MediaMTX execs runOn* hooks
    # directly, so on that image every hook in mediamtx.yaml fails with
    # `exec: "wget": executable file not found in $PATH`. That is logged at INF and
    # otherwise silent: the recorder is never told a segment finished, and the
    # orchestrator is never told a stream went live. This tag is Alpine based and
    # provides busybox wget.
    image: bluenviron/mediamtx:latest-ffmpeg
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      recorder:
        condition: service_healthy
      db-writer:
        condition: service_healthy
      orchestrator:
        condition: service_started
    ports:
      - "8554:8554"       # RTSP  — drone publishes + app pulls raw stream
      - "1935:1935"       # RTMP  — app pushes annotated stream
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC signalling (WHEP)
      - "8189:8189/udp"   # WebRTC ICE — actual media UDP flow
    environment:
      MTX_WEBRTCICEHOSTNAT1TO1IPS: ${MEDIAMTX_HOST}
    volumes:
      - ./configs/mediamtx/mediamtx.yaml:/mediamtx.yml:ro
      - recordings:/recordings

  # ── MQTT broker ───────────────────────────────────────────────────────────────
  mosquitto:
    # eclipse-mosquitto does not ship the go-auth plugin mosquitto.conf now
    # requires (auth_plugin /mosquitto/go-auth.so). This image is the stock
    # broker plus that plugin prebuilt in; its config lives at
    # /etc/mosquitto/mosquitto.conf, not /mosquitto/config/ like the stock image.
    image: iegomez/mosquitto-go-auth:2.1.0-mosquitto_2.0.15
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
    ports:
      - "1883:1883"     # MQTT  — drone publishes, app subscribes
      #- "8883:8883"    # MQTTS — uncomment together with the listener block in mosquitto.conf
    volumes:
      - ./configs/mosquitto/mosquitto.conf:/etc/mosquitto/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      #- ./certificates/mosquitto:/mosquitto/certs:ro   # required for MQTTS

  # ── DB writer sidecar ─────────────────────────────────────────────────────────
  db-writer:
    build:
      context: db_writer
    restart: unless-stopped
    networks: [comms-net]
    ports:
      - "8002:8000"     # HTTP API — app POSTs alerts here from outside the comms network
    environment:
      DB_SERVICE:         ${DB_SERVICE:-postgresql}
      DB_HOST:            ${DB_HOST}
      DB_PORT:            ${DB_PORT:-5432}
      DB_NAME:            ${DB_NAME}
      DB_WORKER_NAME:     ${DB_WORKER_NAME}
      DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD}
      # Mints both viewer and publisher tokens; ws-server validates with the same secret.
      SESSION_JWT_SECRET:    ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env}
      VIEWER_TOKEN_TTL_S:    ${VIEWER_TOKEN_TTL_S:-43200}
      PUBLISHER_TOKEN_TTL_S: ${PUBLISHER_TOKEN_TTL_S:-86400}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Portal ────────────────────────────────────────────────────────────────────
  # The account pages, and the only new service on the public side. It is what keeps
  # db-writer off it: the browser talks to the portal, the portal talks to db-writer
  # over comms-net.
  #
  # Note what is NOT here: SESSION_JWT_SECRET and every DB_* variable. The portal
  # mints nothing, validates nothing and reads no table — it forwards the session
  # cookie and lets db-writer answer. That is deliberate (§7), so adding either of
  # those here would undo it.
  portal:
    build:
      context: portal
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8003:8000"     # plain HTTP; the ingress tier would forward 443 here
    environment:
      DB_WRITER_URL: http://db-writer:8000
      # Backs the rate limits on /login and /register — the two endpoints anyone
      # on the internet can reach. Database 1, not ws-server's 0: nothing would
      # collide (INCR keys against pub/sub channels), but a FLUSHDB aimed at one
      # should not reach the other.
      REDIS_URL: redis://redis:6379/1
      # How many proxies sit in front. It decides which X-Forwarded-For entry is
      # believed, so it must match reality: too high and a client picks its own
      # rate-limit bucket, or pushes somebody else's to the limit. 0 = trust
      # nothing, which is right when the portal is reached directly.
      TRUSTED_PROXY_HOPS: ${PORTAL_TRUSTED_PROXY_HOPS:-0}
      # Hostnames the BROWSER dials, not ones this container dials. Video and
      # alerts go straight from the browser to MediaMTX and ws-server; the portal
      # only composes the URLs.
      # Required, but guarded in the portal rather than with ${VAR:?} here: a
      # compose interpolation error aborts the whole file, so the guard that
      # belongs to one service would stop every service from starting.
      MEDIA_PUBLIC_HOST: ${MEDIAMTX_HOST}
      WS_PUBLIC_HOST:    ${WS_PUBLIC_HOST:-}
      WS_PORT:           ${WS_PORT:-8765}
      # Both must stay true wherever the browser reaches this over HTTPS. A Secure
      # cookie is simply not sent over http://, so turning it off for a local test
      # and forgetting looks like a login that works and then forgets you.
      COOKIE_SECURE:     ${PORTAL_COOKIE_SECURE:-true}
      PUBLIC_TLS:        ${PORTAL_PUBLIC_TLS:-true}
      PORTAL_ALLOWED_ORIGIN_HOSTS: ${PORTAL_ALLOWED_ORIGIN_HOSTS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── WS server ─────────────────────────────────────────────────────────────────
  ws-server:
    build:
      context: ws_server
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${WS_PORT:-8765}:${WS_PORT:-8765}"   # WebSocket — viewers connect here (proxy terminates WSS)
      - "8001:8000"                             # HTTP API — app POSTs alerts here from outside the comms network
    environment:
      WS_PORT: ${WS_PORT:-8765}
      REDIS_URL: redis://redis:6379/0
      # Shared with db-writer, which mints the tokens this validates. No publisher
      # secret here: app containers present a per-flight token db-writer issued them.
      SESSION_JWT_SECRET: ${SESSION_JWT_SECRET:?set SESSION_JWT_SECRET in .env}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Flight orchestrator ───────────────────────────────────────────────────────
  # One GPU container per active flight, created when a stream goes live and destroyed
  # when it stops. MediaMTX drives it through runOnAvailable / runOnUnavailable.
  #
  # NOT exposed to the host, and it must never be: it holds the Docker socket, so
  # anything that can reach it can start containers on this machine.
  orchestrator:
    build:
      context: orchestrator
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
    volumes:
      # The Docker backend's whole privilege. Swapped for a service account when the
      # Kubernetes backend lands.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      APP_IMAGE:         ${APP_IMAGE:?set APP_IMAGE in .env — the GPU app image to run per flight}
      DB_WRITER_URL:     http://db-writer:8000
      APP_NETWORK:       comms-net
      APP_GPUS:          ${APP_GPUS:-all}
      APP_SHM_SIZE:      ${APP_SHM_SIZE:-256m}
      RECONNECT_GRACE_S: ${RECONNECT_GRACE_S:-30}

      # Everything below is forwarded to each flight container with the APP_ENV_
      # prefix stripped. The orchestrator does not interpret any of it; per-flight
      # values (flight id, token, stream paths) always win over these.
      APP_ENV_DB_WRITER_URL:              http://db-writer:8000
      APP_ENV_WS_SERVER_URL:              http://ws-server:8000
      APP_ENV_VIDEO_STREAM_READER_HOST:   mediamtx
      APP_ENV_VIDEO_OUT_STREAM_HOST:      mediamtx
      APP_ENV_TELEMETRY_LISTENER_HOST:    mosquitto
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Recording upload sidecar ──────────────────────────────────────────────────
  recorder:
    build:
      context: recorder
    restart: unless-stopped
    networks: [comms-net]
    depends_on:
      db-writer:
        condition: service_healthy
    environment:
      DB_WRITER_URL:                     http://db-writer:8000
      RECORDING_STORE_SERVICE:           ${RECORDING_STORE_SERVICE:-local}
      RECORDING_DELETE_LOCAL_ON_SUCCESS: ${RECORDING_DELETE_LOCAL_ON_SUCCESS:-false}
      RECORDING_AZURE_CONNECTION_STRING: ${RECORDING_AZURE_CONNECTION_STRING:-}
      RECORDING_AZURE_CONTAINER_NAME:    ${RECORDING_AZURE_CONTAINER_NAME:-}
      RECORDING_AZURE_BLOB_PREFIX:       ${RECORDING_AZURE_BLOB_PREFIX:-}
      RECORDING_AWS_BUCKET_NAME:         ${RECORDING_AWS_BUCKET_NAME:-}
      RECORDING_AWS_KEY_PREFIX:          ${RECORDING_AWS_KEY_PREFIX:-}
      RECORDING_AWS_ACCESS_KEY_ID:       ${RECORDING_AWS_ACCESS_KEY_ID:-}
      RECORDING_AWS_SECRET_ACCESS_KEY:   ${RECORDING_AWS_SECRET_ACCESS_KEY:-}
      RECORDING_AWS_REGION_NAME:         ${RECORDING_AWS_REGION_NAME:-}
    volumes:
      - recordings:/recordings
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 12
